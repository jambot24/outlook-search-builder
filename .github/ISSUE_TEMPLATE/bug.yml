name: Bug report
description: Something on the site does not work.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Edge 128 on Windows 11
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Share link (optional)
      description: Use "Copy share link" to include the search you were building.
